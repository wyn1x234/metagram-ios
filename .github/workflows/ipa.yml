name: MetaGram IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout MetaGram
        uses: actions/checkout@v4

      - name: Free disk for the build
        run: |
          set -eux
          sudo rm -rf \
            /Applications/Xcode_27.0.app \
            /Applications/Xcode_27.2.app \
            /Applications/Xcode_27.3_beta.app \
            || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches || true
          df -h /

      - name: Checkout Telegram-iOS
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: master
          submodules: recursive
          fetch-depth: 0
          path: src

      - name: Apply MetaGram
        run: python3 apply_metagram.py "$GITHUB_WORKSPACE/src"

      - name: Select Xcode from versions.json
        run: |
          set -eux
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("src/versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          sw_vers

      - name: Stage canonical source directory
        run: |
          set -eux
          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios
          mv "$GITHUB_WORKSPACE/src" /Users/Shared/telegram-ios
          git config --global --add safe.directory /Users/Shared/telegram-ios

      - name: Build unsigned IPA
        working-directory: /Users/Shared/telegram-ios
        run: |
          set -eux
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_metagram" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          cp bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa "$OUTPUT_PATH/Telegram.ipa"

          cd "$OUTPUT_PATH"
          rm -rf Payload
          unzip -q Telegram.ipa
          APP=$(echo Payload/*.app)
          if /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MetaGram" "$APP/Info.plist"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string MetaGram" "$APP/Info.plist"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MetaGram" "$APP/Info.plist"
          rm -f Telegram.ipa MetaGram.ipa
          zip -qry MetaGram.ipa Payload
          rm -rf Payload
          ls -lh MetaGram.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MetaGram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/MetaGram.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: metagram-${{ env.BUILD_NUMBER }}-${{ github.run_number }}
          name: MetaGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned MetaGram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}).
            Sign this IPA with a personal Apple ID. A free certificate lasts 7 days.
          files: /Users/Shared/telegram-ios/build/artifacts/MetaGram.ipa
          fail_on_unmatched_files: true
